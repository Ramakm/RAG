[project]
name = "rag-spryple"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ramakm", email = "itsramakrushna@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.8",
    "langchain-anthropic>=1.7.9",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-core>=1.7.4",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=0.3.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
]

[project.scripts]
rag-spryple = "rag_spryple:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
